name: meteogram
on:
  schedule:
    - cron: '7 * * * *'      # co godzinę
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

jobs:
  shot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python shot.py
      - uses: actions/upload-artifact@v4   # pełny zrzut do dobierania przycięcia
        with:
          name: debug
          path: full.png
      - name: Publish to branch "data"
        run: |
          mkdir out && cp meteogram.png out/ && cd out
          git init -q -b data
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add meteogram.png && git commit -qm "meteogram"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
